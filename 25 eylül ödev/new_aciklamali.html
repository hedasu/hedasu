<!DOCTYPE html>

<!-- html : sayfanın bütün HTML kodlarını kapsayan ana etikettir. -->
<!-- lang : sayfanın dilini belirtir. -->
<html lang="en">

<head>

    <!-- charset : sayfada Türkçe karakterler gibi karakterlerin düzgün görünmesini sağlar. -->
    <meta charset="UTF-8">

    <!-- viewport : sayfanın telefon ve tablet gibi farklı ekran boyutlarına uyum sağlamasına yardımcı olur. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title : tarayıcı sekmesinde görünen başlıktır. -->
    <title>Sipariş & Gelir Kokpit Dashboard</title>


    <!-- style : sayfanın görünümünü düzenlediğimiz CSS kodlarını yazdığımız bölümdür. -->
    <style>

        /* :root : bütün sayfada tekrar kullanacağımız değerleri değişken olarak tanımlamamızı sağlar. */
        /* -- ile başlayanlar CSS değişkenleridir. */
        :root {
            --bg: #f8f7f4;
            --card: #ffffff;
            --border: #e6e5df;
            --text: #181716;
            --muted: #6b6963;
            --clay: #c85a32;
            --clay-hover: #b04e29;

            /* sayfada kullanılacak yazı tiplerini belirliyoruz. */
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }


        /* * : sayfadaki bütün HTML elemanlarını seçer. */
        * {
            /* genişlik ve yüksekliğin hesaplanmasına padding ve borderı da dahil eder. */
            box-sizing: border-box;

            /* tarayıcının otomatik verdiği dış boşlukları kaldırır. */
            margin: 0;

            /* tarayıcının otomatik verdiği iç boşlukları kaldırır. */
            padding: 0;
        }


        /* body : sayfada görünen bütün içeriğin bulunduğu ana bölümdür. */
        body {

            /* var() yukarıda oluşturduğumuz CSS değişkenini kullanmamızı sağlar. */
            background: var(--bg);

            /* yazı rengini belirler. */
            color: var(--text);

            /* kullanılacak yazı tipini belirler. */
            font-family: var(--font-main);

            /* sayfanın iç kenarlarından boşluk bırakır. */
            padding: 36px 16px;

            /* satırlar arasındaki yüksekliği belirler. */
            line-height: 1.5;
        }


        /* . ile başlayan isimler HTML'deki classları seçmek için kullanılır. */
        /* kokpit classına sahip ana alanı düzenliyoruz. */
        .kokpit {

            /* sayfanın en fazla 960px genişliğinde olmasını sağlar. */
            max-width: 960px;

            /* 0 üst-alt boşluğu, auto ise sağ-sol boşluğu otomatik ayarlayıp alanı ortalar. */
            margin: 0 auto;
        }



        /* Header & KPI */

        /* sayfanın başlık bölümünü düzenliyoruz. */
        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;

            /* başlığın altına çizgi ekler. */
            border-bottom: 1px solid var(--border);
        }


        /* header içindeki küçük Sipariş Takip yazısını düzenler. */
        .header__tag {
            font-size: 11px;

            /* yazıyı büyük harfe çevirir. */
            text-transform: uppercase;

            /* harflerin arasındaki boşluğu artırır. */
            letter-spacing: 0.12em;

            color: var(--clay);

            /* yazının kalınlığını belirler. */
            font-weight: 700;
        }


        /* ana başlığın görünümünü düzenler. */
        .header__title {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
        }



        /* KPI : ekranda gösterilen özet bilgiler için oluşturulan alan. */
        .kpi-grid {

            /* grid : elemanları satır ve sütun şeklinde düzenlememizi sağlar. */
            display: grid;

            /* 3 tane eşit genişlikte sütun oluşturur. */
            grid-template-columns: repeat(3, 1fr);

            /* elemanların arasına 14px boşluk bırakır. */
            gap: 14px;

            margin-bottom: 24px;
        }


        /* her bir KPI kartının görünümünü düzenler. */
        .kpi-card {
            background: var(--card);

            /* kartın kenarına çizgi ekler. */
            border: 1px solid var(--border);

            /* kartın köşelerini yuvarlar. */
            border-radius: 8px;

            /* kartın içinden boşluk bırakır. */
            padding: 14px 18px;
        }


        /* KPI kartlarının içindeki span etiketlerini düzenler. */
        .kpi-card span {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }


        /* KPI kartlarının içindeki h3 başlıklarını düzenler. */
        .kpi-card h3 {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 4px;
        }



        /* Layout */

        /* form ve sipariş listesinin sayfadaki yerleşimini düzenler. */
        .layout {
            display: grid;

            /* ilk sütun 320px ikinci sütun ise kalan alanı kaplar. */
            grid-template-columns: 320px 1fr;

            gap: 24px;
        }


        /* @media : ekran boyutuna göre farklı CSS uygulamamızı sağlar. */
        /* ekran 768px veya daha küçükse aşağıdaki kodlar çalışır. */
        @media (max-width: 768px) {

            .layout,
            .kpi-grid {

                /* küçük ekranlarda bütün alanları tek sütun haline getirir. */
                grid-template-columns: 1fr;
            }
        }



        /* Form & Panel */

        /* form ve sipariş listesinin bulunduğu beyaz paneller. */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }


        /* panel içerisindeki h4 başlığını düzenler. */
        .panel h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }


        /* formdaki her alanın altına boşluk bırakır. */
        .field {
            margin-bottom: 12px;
        }


        /* formdaki label yani açıklama yazılarını düzenler. */
        .field label {

            /* block : labelın kendi satırını kaplamasını sağlar. */
            display: block;

            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }


        /* formdaki input ve select alanlarını birlikte düzenliyoruz. */
        .field input,
        .field select {

            /* bulunduğu alanın tamamını kaplar. */
            width: 100%;

            padding: 8px 10px;
            font-size: 13px;

            /* inherit : üst elementteki yazı tipini kullanır. */
            font-family: inherit;

            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }


        /* :focus : kullanıcı input veya select alanına tıkladığında uygulanır. */
        .field input:focus,
        .field select:focus {

            /* tarayıcının otomatik verdiği dış çizgiyi kaldırır. */
            outline: none;

            border-color: var(--clay);
            background: #fff;
        }


        /* Siparişi Kaydet butonunu düzenler. */
        .btn-submit {
            width: 100%;
            background: var(--clay);
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;

            /* mouse butonun üzerine geldiğinde el işareti çıkar. */
            cursor: pointer;

            margin-top: 6px;
        }


        /* :hover : mouse butonun üzerine geldiğinde uygulanır. */
        .btn-submit:hover {
            background: var(--clay-hover);
        }



        /* Liste & Filtre */

        /* arama kutusu ve kategori filtresini yan yana getirir. */
        .filter-bar {

            /* flex : elemanların yerleşimini daha kolay düzenlememizi sağlar. */
            display: flex;

            gap: 10px;
            margin-bottom: 14px;
        }


        /* sipariş listesini düzenler. */
        .order-list {
            display: flex;

            /* elemanları alt alta dizer. */
            flex-direction: column;

            gap: 10px;
        }


        /* her bir sipariş kartının görünümünü düzenler. */
        .order-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;

            display: flex;

            /* elemanları iki tarafa ayırır. */
            justify-content: space-between;

            /* elemanları dikey olarak ortalar. */
            align-items: center;
        }


        .order-item h5 {
            font-size: 13px;
            font-weight: 600;
        }


        .order-item p {
            font-size: 12px;
            color: var(--muted);
        }


        /* kategori etiketi ve sil butonunun bulunduğu alan. */
        .meta-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        /* kategori etiketlerinin ortak görünümü. */
        .badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            font-family: var(--font-mono);
        }


        /* Mobilya kategorisinin rengi. */
        .badge--mobilya {
            background: #e0e7ff;
            color: #3730a3;
        }


        /* Aydınlatma kategorisinin rengi. */
        .badge--aydinlatma {
            background: #fef3c7;
            color: #b45309;
        }


        /* Seramik isimli kategori etiketi için görünüm oluşturulmuş. */
        .badge--seramik {
            background: #d1fae5;
            color: #065f46;
        }

        /*
        HATA / UYUMSUZLUK:
        HTML ve JavaScript tarafında "Seramik" kategorisi bulunmuyor.
        onun yerine "Mutfak" kategorisi bulunuyor.
        aşağıdaki JavaScript kodunda Mutfak kategorisi de badge--seramik classını kullanıyor.
        yani kod çalışır ama classın adı kullanılan kategoriyle uyuşmuyor.
        */


        /* Sil butonunu düzenler. */
        .btn-del {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }


        /* mouse Sil butonunun üzerine geldiğinde kırmızı olur. */
        .btn-del:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

    </style>

</head>



<body>

    <!-- bütün dashboardu kapsayan ana alan. -->
    <div class="kokpit">


        <!-- sayfanın başlık bölümü. -->
        <header class="header">

            <span class="header__tag">Sipariş Takip</span>

            <!-- h1 : sayfanın ana başlığıdır. -->
            <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>

        </header>



        <!-- KPI özet bilgilerinin bulunduğu bölüm. -->
        <section class="kpi-grid">


            <!-- kayıtlı sipariş sayısını gösteren kart. -->
            <div class="kpi-card">

                <span>Kayıtlı sipariş</span>

                <!-- id : JavaScript tarafından bu elemana ulaşmamızı sağlar. -->
                <!-- başlangıçta 0 gösteriyoruz daha sonra JavaScript değiştirecek. -->
                <h3 id="kpiCount">0</h3>

            </div>


            <!-- toplam sipariş tutarını gösteren kart. -->
            <div class="kpi-card">

                <span>Toplam Sipariş Tutar</span>

                <h3 id="kpiTotal">0 ₺</h3>

            </div>


            <!-- ortalama ürün fiyatını gösteren kart. -->
            <div class="kpi-card">

                <span>Ortalama Ürün Fiyatı</span>

                <h3 id="kpiAvg">0 ₺</h3>

            </div>

        </section>



        <!-- sayfanın ana içerik bölümü. -->
        <main class="layout">


            <!-- yeni sipariş eklemek için kullanılan panel. -->
            <section class="panel">

                <h4>Yeni sipariş kaydı</h4>


                <!-- form : kullanıcıdan bilgi almak için kullanılır. -->
                <form id="orderForm">


                    <div class="field">

                        <!-- label : input alanının ne için kullanıldığını gösterir. -->
                        <label for="prodName">Ürün Adı</label>

                        <!-- type="text" metin girilmesini sağlar. -->
                        <!-- placeholder input boşken gösterilen örnek yazıdır. -->
                        <!-- required bu alanın boş bırakılamayacağını belirtir. -->
                        <input
                            type="text"
                            id="prodName"
                            placeholder="Sehpa"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="prodCat">Kategori</label>

                        <!-- select : kullanıcıya hazır seçenekler sunar. -->
                        <select name="prodCat" id="prodCat">

                            <!-- option : select içerisindeki seçeneklerdir. -->
                            <option value="Mobilya">Mobilya</option>
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="prodPrice">Fiyat</label>

                        <!-- type="number" sadece sayı girişi için kullanılır. -->
                        <!-- value başlangıç değeridir. -->
                        <!-- min girilebilecek minimum değeri belirler. -->
                        <!-- step sayıların kaç kaç artacağını belirtir. -->
                        <input
                            type="number"
                            id="prodPrice"
                            value="3250"
                            min="100"
                            step="50"
                            required
                        >

                    </div>


                    <!-- type="submit" butona basıldığında formu gönderir. -->
                    <button type="submit" class="btn-submit">
                        Siparişi Kaydet
                    </button>

                </form>

            </section>



            <!-- siparişlerin listeleneceği panel. -->
            <section class="panel">


                <!-- arama ve kategori filtresinin bulunduğu alan. -->
                <div class="filter-bar">


                    <!-- kullanıcı ürün adına göre arama yapabilir. -->
                    <input
                        type="text"
                        id="searchInput"
                        class="field"
                        style="margin-bottom: 0;"
                        placeholder="Ürün Adına Göre Filtrele"
                    >


                    <!-- kategoriye göre filtreleme yapılmasını sağlar. -->
                    <select
                        id="categoryFilter"
                        style="width: 130px; font-size: 12px;padding: 6px;"
                    >

                        <!-- ALL seçilirse bütün kategoriler gösterilecek. -->
                        <option value="ALL">Tüm Kategoriler</option>

                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>

                    </select>

                </div>


                <!-- siparişler JavaScript tarafından dinamik olarak buraya eklenecek. -->
                <div id="orderContainer" class="order-list">

                    <!--Dinamik olarak elemanlar buraya basılacak / eklenecek-->

                </div>

            </section>

        </main>

    </div>



    <!-- script : JavaScript kodlarımızı yazdığımız bölümdür. -->
    <!-- JavaScript ile sayfayı dinamik hale getiriyoruz. -->
    <script>


        //let : sonradan değiştirilebilecek değişkenleri tanımlamak için kullanılır.

        //orders : bütün siparişleri tutan dizimizdir.
        //[] bir Array yani dizi oluşturur.
        //dizinin içindeki her {} ise bir object yani nesnedir.
        //her siparişin id, name, category ve price bilgileri vardır.
        let orders = [

            { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },

            { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },

            { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },

            { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },

            { id: 5, name: "Ocak", category: "Mutfak", price: 15000 }

        ];



        //dom elementleri toplayalım

        //DOM : HTML elemanlarına JavaScript tarafından ulaşmamızı sağlar.
        //document.getElementById : HTML içerisindeki id değerine göre elementi bulur.

        //const : değeri sonradan başka bir değere atanmayacak değişkenlerde kullanılır.


        //siparişlerin gösterileceği alanı HTML'den alıyoruz.
        const orderContainer = document.getElementById('orderContainer');


        //sipariş ekleme formunu HTML'den alıyoruz.
        const orderForm = document.getElementById('orderForm');


        //arama inputunu HTML'den alıyoruz.
        const searchInput = document.getElementById('searchInput');


        //kategori filtresini HTML'den alıyoruz.
        const categoryFilter = document.getElementById('categoryFilter');


        //sipariş sayısının gösterileceği KPI alanını alıyoruz.
        const kpiCount = document.getElementById('kpiCount');


        //toplam tutarın gösterileceği KPI alanını alıyoruz.
        const kpiTotal = document.getElementById('kpiTotal');


        //ortalama fiyatın gösterileceği KPI alanını alıyoruz.
        const kpiAvg = document.getElementById('kpiAvg');



        //KPI değerlerini güncelleyen fonksiyon.

        //=> arrow function yani ok fonksiyonudur.
        //dataList fonksiyona dışarıdan gönderilecek ürün listesidir.
        const updateKPIs = (dataList) => {


            //.length : dizinin içinde kaç eleman olduğunu verir.
            //.textContent : HTML elementinin içindeki yazıyı değiştirmemizi sağlar.

            //ürün sayısını KPI alanına yazdırıyoruz.
            kpiCount.textContent = dataList.length;



            //if : verilen koşul doğruysa içindeki kodları çalıştırır.

            //=== : iki değerin hem değer hem tür olarak eşit olup olmadığını kontrol eder.

            //eğer listede hiç ürün yoksa toplam ve ortalama değerlerini 0 yapıyoruz.
            if (dataList.length === 0) {

                kpiTotal.textContent = "0 ₺";

                kpiAvg.textContent = "0 ₺";


                //return : fonksiyonun çalışmasını burada bitirir.
                //ürün olmadığı için aşağıdaki hesaplamaları yapmaya gerek kalmaz.
                return;
            }



            //Toplam Tutar (.reduce)

            //.reduce : dizideki değerleri tek bir değerde birleştirmek için kullanılır.
            //burada bütün ürün fiyatlarını topluyoruz.

            //acc : bir önceki işlemlerden gelen toplam değerdir.
            //curr : o anda işlem yapılan üründür.
            //0 ise toplamın başlangıç değeridir.
            const total = dataList.reduce(
                (acc, curr) => acc + curr.price,
                0
            );


            //toLocaleString("tr-TR") : sayıyı Türkçe sayı biçiminde gösterir.
            //örneğin 10000 sayısını 10.000 olarak gösterir.

            //${} ile değişkeni yazının içerisine ekliyoruz.
            //`` işaretleri template literal oluşturmamızı sağlar.
            kpiTotal.textContent =
                `${total.toLocaleString("tr-TR")} ₺`;



            //Ortalama Fiyat

            //toplam fiyatı ürün sayısına bölerek ortalama fiyatı hesaplıyoruz.
            const avg = total / dataList.length;


            //Math.round : ondalıklı sayıyı en yakın tam sayıya yuvarlar.
            kpiAvg.textContent =
                `${Math.round(avg).toLocaleString("tr-TR")} ₺`;

        }



        //Filtreleme bölümü (dinamik dom / Render Motoru)

        //renderOrders : siparişleri filtreleyip ekrana yazdıran fonksiyondur.
        const renderOrders = () => {


            //.value : inputun içerisindeki mevcut değeri alır.

            //.toLowerCase() : yazıyı küçük harflere çevirir.
            //böylece büyük küçük harf farkından kaynaklanan sorunları azaltıyoruz.

            //.trim() : yazının başındaki ve sonundaki gereksiz boşlukları siler.

            //arama kutusuna yazılan değeri alıyoruz.
            const term =
                searchInput.value.toLowerCase().trim();


            //kategori filtresinde seçilen değeri alıyoruz.
            const selectedCat = categoryFilter.value;



            //filtreleme bölümü

            //.filter : dizide verdiğimiz koşula uyan elemanları seçer.
            //sonuç olarak yeni bir dizi oluşturur.

            const filtered = orders.filter(order => {


                //ürünün adını küçük harfe çeviriyoruz.

                //.includes(term) : ürün adının içinde kullanıcının
                //aradığı yazının bulunup bulunmadığını kontrol eder.

                //bulunuyorsa true, bulunmuyorsa false döner.
                const matchesName =
                    order.name.toLowerCase().includes(term);



                // || : VEYA anlamına gelir.
                //iki koşuldan birinin doğru olması yeterlidir.

                //kategori ALL ise bütün kategoriler kabul edilir.
                //ALL değilse ürünün kategorisi seçilen kategoriyle aynı olmalıdır.
                const mathesCategory =
                    selectedCat === "ALL" ||
                    order.category === selectedCat;



                // && : VE anlamına gelir.
                //iki koşulun da doğru olması gerekir.

                //ürünün hem adı aramaya uymalı
                //hem de kategori koşuluna uymalıdır.
                return matchesName && mathesCategory;

            });



            //.innerHTML : bir HTML elementinin içeriğini değiştirmemizi sağlar.

            //önce eski ürünleri temizliyoruz.
            //böylece filtreleme yapıldığında eski ürünler ekranda kalmaz.
            orderContainer.innerHTML = "";



            //filtre sonucunda hiç ürün bulunamadıysa bu bölüm çalışır.
            if (filtered.length === 0) {


                //innerHTML kullanarak HTML kodunu JavaScript ile ekliyoruz.
                orderContainer.innerHTML = `

                    <div style="padding:24px; text-align:center; color:var(--muted);font-size:12px">

                        Kriterlere Uygun Ürün Bulunamadı

                    </div>

                `;


                //ürün olmadığı için KPI değerlerini boş dizi ile güncelliyoruz.
                updateKPIs([]);


                //fonksiyon burada sonlandırılır.
                return;
            }



            //dinamik element üretim


            //.forEach : dizideki bütün elemanları tek tek dolaşır.
            //burada filtrelenen bütün siparişler için işlem yapıyoruz.
            filtered.forEach(order => {


                //document.createElement : JavaScript ile yeni HTML elementi oluşturur.

                //her sipariş için article elementi oluşturuyoruz.
                const item =
                    document.createElement("article");


                //.className : oluşturduğumuz elemente class vermemizi sağlar.
                item.className = "order-item";


                //.setAttribute : HTML elementine özellik eklememizi sağlar.

                //data-id içerisine siparişin id değerini koyuyoruz.
                //böylece HTML elementi ile siparişin id'sini ilişkilendiriyoruz.
                item.setAttribute("data-id", order.id);



                //? : üçlü koşul yani ternary operatorüdür.
                //if else işlemini daha kısa şekilde yazmamızı sağlar.

                //kategori Mobilya ise badge--mobilya classı kullanılır.
                //değilse kategori Aydınlatma mı diye kontrol edilir.
                //Aydınlatma ise badge--aydinlatma kullanılır.
                //ikisinden biri değilse badge--seramik kullanılır.
                const badgeClass =
                    order.category === "Mobilya"
                        ? "badge--mobilya"
                        : order.category === "Aydınlatma"
                            ? "badge--aydinlatma"
                            : "badge--seramik";


                /*
                HATA / UYUMSUZLUK:
                orders içerisinde üçüncü kategori "Mutfak" olarak tanımlanmıştır.
                fakat burada Mutfak için özel bir class verilmemiştir.

                Mobilya ve Aydınlatma dışındaki bütün kategoriler
                otomatik olarak badge--seramik classını alır.

                bu yüzden Mutfak ürünleri de badge--seramik görünümünü kullanır.
                kod çalışır ama class ismi kategoriyle uyumlu değildir.
                */


                //oluşturduğumuz article elementinin içine
                //ürünün HTML yapısını ekliyoruz.
                item.innerHTML = `

                    <div>

                        <!-- ${order.name} ürünün adını ekrana yazdırır. -->
                        <h5>${order.name}</h5>

                        <!-- ürün fiyatını Türkçe sayı biçiminde gösteriyoruz. -->
                        <p>
                            Birim Fiyat:
                            ${order.price.toLocaleString("tr-TR")} ₺
                        </p>

                    </div>


                    <div class="meta-box">

                        <!-- kategoriye göre belirlediğimiz badge classını kullanıyoruz. -->
                        <span class="badge ${badgeClass}">
                            ${order.category}
                        </span>


                        <!-- data-action ile bu butonun silme işlemi için olduğunu belirtiyoruz. -->
                        <button
                            class="btn-del"
                            data-action="delete"
                        >
                            Sil
                        </button>

                    </div>

                `;



                //.appendChild : oluşturduğumuz elementi başka bir HTML elementinin içine ekler.

                //hazırladığımız sipariş kartını orderContainer içine ekliyoruz.
                orderContainer.appendChild(item);



                //ekranda gösterilen filtrelenmiş ürünlere göre
                //KPI değerlerini güncelliyoruz.
                updateKPIs(filtered);


            });

        }



        /*
        HATA / EKSİK:

        yukarıda orderForm değişkeni ile formu HTML'den aldık.
        HTML tarafında da "Siparişi Kaydet" butonu bulunuyor.

        fakat orderForm için submit addEventListener yazılmamış.

        yani kullanıcı Siparişi Kaydet butonuna bastığında
        formdaki ürün adı, kategori ve fiyat bilgilerini alıp
        orders dizisine ekleyen kod bulunmuyor.

        bu yüzden buton görünür ama yeni sipariş ekleme işlemi yapılmaz.
        */



        /*
        HATA / EKSİK:

        her sipariş için yukarıda "Sil" butonu oluşturuluyor.

        fakat Sil butonuna basıldığında çalışacak
        click addEventListener kodu yazılmamış.

        yani data-action="delete" yazılmış olsa da
        bu değeri kontrol edip ürünü orders dizisinden
        çıkaran kod bulunmuyor.

        bu yüzden Sil butonu görünür ama ürünü silemez.
        */



        //addEventListener : bir olay gerçekleştiğinde
        //hangi fonksiyonun çalışacağını belirlememizi sağlar.


        //"input" olayı kullanıcı arama kutusuna her yazı yazdığında çalışır.

        //arama kutusuna bir şey yazıldığında
        //renderOrders fonksiyonunu tekrar çalıştırıyoruz.
        searchInput.addEventListener(
            "input",
            renderOrders
        );



        //"change" olayı select içerisindeki seçim değiştiğinde çalışır.

        //kategori değiştirildiğinde ürünleri tekrar filtreliyoruz.
        categoryFilter.addEventListener(
            "change",
            renderOrders
        );



        //sayfa ilk açıldığında siparişlerin ekranda görünmesi için
        //renderOrders fonksiyonunu bir kere çalıştırıyoruz.
        renderOrders();


    </script>

</body>

</html>
