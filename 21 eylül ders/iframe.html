<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h3{
            margin-top: 0;
            color: #1e293b;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Iframe Harita ve Video</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/KXI5le1Rf_E?si=tvY9AXVRENWQMi8t" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24013.993830567113!2d36.97671694999998!3d41.20544050000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40881d3ebb9469e3%3A0x29c6074fb64e3d9e!2sTerme%2C%20Samsun!5e0!3m2!1str!2str!4v1789995791704!5m2!1str!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

</html>
